# Parts mapped onto formats. Minutes are working minutes; breaks sit between sessions.
# Part totals: orientation 15, look-before-you-measure 70, define-good 50,
# check-the-judge 80 (45 core plus 35 extension), decide-and-write-it-down 150 (85 core plus 65 extension).
# review-answers-with-the-langfuse-queue 20 (optional in the live session, expected as homework).
# All parts: 385 minutes.

[one-day]
sessions = [
  { parts = ["orientation", "look-before-you-measure"], minutes = 85 },
  { parts = ["define-good"], minutes = 50 },
  { parts = ["check-the-judge"], minutes = 80 },
  { parts = ["decide-and-write-it-down"], minutes = 150 },
  { parts = ["review-answers-with-the-langfuse-queue"], minutes = 20 },
]

[two-half-days]
sessions = [
  { parts = ["orientation", "look-before-you-measure", "define-good"], minutes = 135 },
  { parts = ["check-the-judge", "decide-and-write-it-down"], minutes = 230 },
  { parts = ["review-answers-with-the-langfuse-queue"], minutes = 20 },
]

[four-evenings]
sessions = [
  { parts = ["orientation", "look-before-you-measure"], minutes = 85 },
  { parts = ["define-good"], minutes = 50 },
  { parts = ["check-the-judge"], minutes = 80 },
  { parts = ["decide-and-write-it-down"], minutes = 150 },
  { parts = ["review-answers-with-the-langfuse-queue"], minutes = 20 },
]

# One live session a week, plus 30 minutes on the learner's own feature between sessions.
[four-weeks-with-your-own-feature]
sessions = [
  { parts = ["orientation", "look-before-you-measure"], minutes = 100 },
  { parts = ["define-good"], minutes = 80 },
  { parts = ["check-the-judge"], minutes = 110 },
  { parts = ["decide-and-write-it-down"], minutes = 155 },
  { parts = ["review-answers-with-the-langfuse-queue"], minutes = 20 },
]
